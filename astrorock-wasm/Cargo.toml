[package]
name = "astrorock-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "WebAssembly (wasm-bindgen) shell for AstroRock."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
astrorock-core = { path = "../astrorock-core" }
agg-gui = { workspace = true }
demo-wgpu = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window",
    "console",
    # WebAudio sink (src/audio.rs)
    "AudioBuffer",
    "AudioBufferSourceNode",
    "AudioContext",
    "AudioContextState",
    "AudioDestinationNode",
    "AudioNode",
    "AudioScheduledSourceNode",
    "AudioParam",
    "GainNode",
    "HtmlAudioElement",
    "HtmlMediaElement",
    "BaseAudioContext",
] }
