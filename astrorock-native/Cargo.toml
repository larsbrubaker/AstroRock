[package]
name = "astrorock-native"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Native shell (winit + wgpu) for AstroRock."

[[bin]]
name = "astrorock-native"
path = "src/main.rs"
test = false

[dependencies]
astrorock-core = { path = "../astrorock-core" }
agg-gui = { workspace = true, features = ["clipboard"] }
# The winit event loop, wgpu surface, and input plumbing all live in the
# published agg-gui-shell — this crate is only the app-specific glue
# (audio, settings file, gamepad polling) threaded through `ShellHost`.
agg-gui-shell = { workspace = true }
# SFX playback — mp3 decode via the default feature set.
rodio = "0.17"
# Gamepad polling (XInput/DirectInput/evdev) — feeds agg_gui::gamepad
# from the shell's per-frame hook.
gilrs = "0.11"
